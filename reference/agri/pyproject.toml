[project]
name = "ipi-aware"
version = "0.1.0"
description = "Code for probing latent IPI-exposure signals in agentic LLMs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "msgspec>=0.19.0",
    "numpy>=2.0",
    "openai>=1.0",
    "PyYAML>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
agentdojo = [
    "agentdojo>=0.1.35",
]
models = [
    "accelerate>=1.0",
    "torch>=2.5",
    "transformers>=4.45",
]
vllm = [
    "accelerate>=1.0",
    "torch>=2.5",
    "transformers>=4.45",
    "vllm==0.27.0",
]
dev = [
    "agentdojo>=0.1.35",
    "pytest>=8.0",
]

[project.scripts]
ipi-signal-probe = "ipi_aware.probes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build]
exclude = [
    "/.pytest_cache",
    "/.ruff_cache",
    "/.mypy_cache",
    "/.venv",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "/logs",
    "/results",
    "/models",
    "/dist",
    "/build",
]

[tool.hatch.build.targets.wheel]
packages = ["ipi_aware"]

[tool.hatch.build.targets.sdist]
include = [
    "/.python-version",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/pytest.ini",
    "/uv.lock",
    "/configs",
    "/docs",
    "/examples",
    "/ipi_aware",
    "/patches",
    "/scripts",
    "/tests",
    "/vendor/agentdojo",
]
